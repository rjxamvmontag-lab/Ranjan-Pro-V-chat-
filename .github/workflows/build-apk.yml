name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK (Debug & Release)
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: 0

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install NPM Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform directory not found. Adding Android platform via Capacitor..."
            npx cap add android
          elif [ ! -f "android/gradlew" ]; then
            echo "Android directory found but gradlew is missing. Re-adding Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "Existing Android platform and gradlew verified."
          fi

          echo "Syncing Capacitor Android web assets..."
          npx cap sync android

          # Ensure automatic SDK download and Java 21 compatibility flags
          if ! grep -q "android.builder.sdkDownload=true" android/gradle.properties 2>/dev/null; then
            echo "android.builder.sdkDownload=true" >> android/gradle.properties
          fi

          if ! grep -q "VERSION_21" android/app/build.gradle 2>/dev/null; then
            sed -i '/buildTypes {/i \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }' android/app/build.gradle || true
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "Execute permission successfully granted to ./android/gradlew"
            ls -la ./android/gradlew
          else
            echo "FATAL ERROR: ./android/gradlew does not exist!"
            ls -la android || true
            exit 1
          fi

      - name: Build Android Debug and Release APKs with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug assembleRelease -Pandroid.builder.sdkDownload=true --stacktrace --no-daemon

      - name: Verify or Sign Release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'MusicPlayerPass2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'freemusicplayer' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'MusicPlayerPass2026!' }}
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          mkdir -p "$RELEASE_DIR"

          # If secret base64 keystore provided, decode and use it
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Decoding secret release signing keystore..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi

          # If app-release-unsigned.apk was produced and keystore exists, sign with apksigner
          if [ -f "$RELEASE_DIR/app-release-unsigned.apk" ] && [ -f "android/app/release.keystore" ]; then
            echo "Signing app-release-unsigned.apk with apksigner..."
            apksigner sign --ks android/app/release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$RELEASE_DIR/app-release.apk" "$RELEASE_DIR/app-release-unsigned.apk"
          fi

          if [ -f "$RELEASE_DIR/app-release.apk" ]; then
            echo "Verifying signature of app-release.apk:"
            apksigner verify --verbose "$RELEASE_DIR/app-release.apk" || true
          fi

      - name: Verify Generated APKs
        run: |
          echo "Checking generated Debug APKs:"
          mkdir -p android/app/build/outputs/apk/debug
          ls -la android/app/build/outputs/apk/debug/ || true

          echo "Checking generated Release APKs:"
          mkdir -p android/app/build/outputs/apk/release
          ls -la android/app/build/outputs/apk/release/ || true

          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp "android/app/build/outputs/apk/release/app-release.apk" "android/app/build/outputs/apk/release/FreeMusicPlayer-release.apk"
          fi

          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Warning: app-debug.apk missing in expected location."
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMusicPlayer-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMusicPlayer-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
