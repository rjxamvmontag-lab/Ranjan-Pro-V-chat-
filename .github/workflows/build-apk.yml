name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: 0

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install NPM Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x ./android/gradlew

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Generation
        run: |
          echo "Checking generated APK files:"
          ls -la android/app/build/outputs/apk/debug/
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not generated in android/app/build/outputs/apk/debug/!"
            exit 1
          fi
          echo "APK successfully verified: android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMusicPlayer-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
