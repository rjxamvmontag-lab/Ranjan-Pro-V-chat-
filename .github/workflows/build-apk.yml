name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest
    env:
      CI: true
      CAPACITOR_TELEMETRY: 0

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install NPM Dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize and Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "Android platform directory not found. Adding Android platform via Capacitor..."
            npx cap add android
          elif [ ! -f "android/gradlew" ]; then
            echo "Android directory found but gradlew is missing. Re-adding Android platform..."
            rm -rf android
            npx cap add android
          else
            echo "Existing Android platform and gradlew verified."
          fi

          echo "Syncing Capacitor Android web assets..."
          npx cap sync android

          # Ensure automatic SDK download and Java 21 compatibility flags
          if ! grep -q "android.builder.sdkDownload=true" android/gradle.properties 2>/dev/null; then
            echo "android.builder.sdkDownload=true" >> android/gradle.properties
          fi

          if ! grep -q "VERSION_21" android/app/build.gradle 2>/dev/null; then
            sed -i '/buildTypes {/i \    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }' android/app/build.gradle || true
          fi

      - name: Grant Execute Permission to Gradlew
        run: |
          if [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
            echo "Execute permission successfully granted to ./android/gradlew"
            ls -la ./android/gradlew
          else
            echo "FATAL ERROR: ./android/gradlew does not exist!"
            ls -la android || true
            exit 1
          fi

      - name: Build Android Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug -Pandroid.builder.sdkDownload=true --stacktrace --no-daemon

      - name: Verify APK Generation
        run: |
          echo "Checking generated APK files:"
          mkdir -p android/app/build/outputs/apk/debug
          ls -la android/app/build/outputs/apk/debug/ || true
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: app-debug.apk was not generated in android/app/build/outputs/apk/debug/!"
            echo "Searching for any generated APK in build directory:"
            find android/app/build -name "*.apk" || true
            exit 1
          fi
          echo "APK successfully verified: android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeMusicPlayer-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
